name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Build Android APK
      run: |
        PUBSPEC_DIR=$(dirname $(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1))
        echo "Found Flutter project at: $PUBSPEC_DIR"
        cd "$PUBSPEC_DIR"
        
        flutter pub get
        
        MAIN_PATH=$(find . -name "main.dart" -not -path "*/.*" | head -n 1)
        echo "Found main.dart at: $MAIN_PATH"
        
        flutter build apk --release -t "$MAIN_PATH"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: LiveStream-App-Release
        path: "**/build/app/outputs/flutter-apk/app-release.apk"
