name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: livestream_app

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: uses/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release -t lib/lib/main.dart

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: LiveStream-App-Release
        path: livestream_app/build/app/outputs/flutter-apk/app-release.apk
